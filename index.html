<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posnet EVO — Interaktywna wizualizacja 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%,
                #23242f 0%, #0e0e15 56%, #050506 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Helvetica Neue", Arial, sans-serif;
    color: #fff; user-select: none;
  }
  #canvas-container { width: 100%; height: 100%; }
  canvas { display: block; }

  .top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 22px 32px; display: flex;
    justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 100%);
    z-index: 10; pointer-events: none;
  }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: 3px; }
  .logo span { color: #d32f2f; }
  .subtitle {
    font-size: 11px; color: #888;
    letter-spacing: 2px; text-transform: uppercase;
  }

  .info-panel {
    position: absolute; top: 88px; right: 32px; width: 350px;
    background: rgba(16, 16, 22, 0.82);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-left: 3px solid #d32f2f; padding: 26px 28px; z-index: 10;
    transition: opacity 0.5s ease; box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }
  .step-counter {
    font-size: 11px; color: #d32f2f;
    letter-spacing: 3px; margin-bottom: 10px; font-weight: 600;
  }
  .info-title {
    font-size: 20px; font-weight: 700;
    margin-bottom: 14px; color: #fff; letter-spacing: 0.3px;
  }
  .info-desc { font-size: 13px; line-height: 1.65; color: #c9c9d2; }
  .info-meta {
    margin-top: 18px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 18px;
  }
  .info-meta div { flex: 1; }
  .info-meta .label {
    font-size: 9px; color: #777; letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .info-meta .value { font-size: 12px; color: #eee; font-weight: 600; }

  .controls {
    position: absolute; bottom: 32px; left: 50%;
    transform: translateX(-50%); display: flex;
    align-items: center; gap: 6px;
    background: rgba(16, 16, 22, 0.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 8px 10px; border-radius: 50px; z-index: 10;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.08);
    color: #fff; padding: 10px 18px; border-radius: 30px;
    cursor: pointer; font-size: 12.5px; font-weight: 500;
    transition: all 0.2s ease; font-family: inherit;
  }
  .btn:hover {
    background: rgba(211, 47, 47, 0.2); border-color: rgba(211, 47, 47, 0.5);
  }
  .btn.primary { background: #d32f2f; border-color: #d32f2f; min-width: 100px; }
  .btn.primary:hover { background: #b71c1c; border-color: #b71c1c; }
  .step-indicator {
    font-size: 12px; color: #aaa; padding: 0 14px;
    letter-spacing: 1px; min-width: 50px; text-align: center;
  }
  .step-dots { display: flex; gap: 6px; padding: 0 12px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    transition: all 0.3s ease; cursor: pointer;
  }
  .dot.active { background: #d32f2f; width: 24px; border-radius: 4px; }

  .tip {
    position: absolute; bottom: 38px; left: 32px;
    color: #555; font-size: 11px; z-index: 10;
    letter-spacing: 0.5px; pointer-events: none;
  }
  .disclaimer {
    position: absolute; top: 88px; left: 32px;
    color: #555; font-size: 10px; max-width: 270px; z-index: 10;
    letter-spacing: 0.3px; line-height: 1.5; pointer-events: none;
  }

  #loader {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; z-index: 100;
    background: #0a0a10; transition: opacity 0.6s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .loader-spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: #d32f2f; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  .loader-text {
    color: #888; font-size: 12px;
    letter-spacing: 2px; text-transform: uppercase;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .info-panel {
      top: auto; bottom: 110px; left: 16px; right: 16px;
      width: auto; padding: 20px;
    }
    .top-bar { padding: 14px 18px; }
    .logo { font-size: 16px; }
    .subtitle, .tip, .disclaimer { display: none; }
    .controls { padding: 6px 8px; }
    .btn { padding: 8px 12px; font-size: 11px; }
    .step-dots { display: none; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Ładowanie sceny 3D…</div>
</div>

<div id="canvas-container"></div>

<div class="top-bar">
  <div class="logo">POSNET<span> EVO</span></div>
  <div class="subtitle">Wizualizacja 3D — Eksplozja modułowa</div>
</div>

<div id="info-panel" class="info-panel">
  <div class="step-counter" id="step-counter">KROK 1 / 4</div>
  <div class="info-title" id="info-title">Kasoterminal Posnet EVO</div>
  <div class="info-desc" id="info-desc">Ładowanie…</div>
  <div class="info-meta" id="info-meta"></div>
</div>

<div class="controls">
  <button class="btn" id="btn-prev">‹ Wstecz</button>
  <button class="btn primary" id="btn-play">⏸ Pauza</button>
  <button class="btn" id="btn-next">Dalej ›</button>
  <div class="step-dots" id="step-dots"></div>
  <div class="step-indicator" id="step-indicator">1 / 4</div>
</div>

<div class="tip">Przeciągnij myszą — obrót · Scroll — zoom · ESC — reset</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ===========================================================
// POSNET EVO — Wizualizacja 3D (render fotorealistyczny)
// Terminal handheld: smukły, opływowy korpus, dwa ekrany,
// drukarka z unoszoną pokrywą (emboss POSNET + NFC).
// Układ świata: długa oś = Z. Operator: +Z. Klient: -Z.
// ===========================================================

(function () {
  'use strict';

  if (typeof THREE === 'undefined') {
    document.getElementById('loader').innerHTML =
      '<div style="color:#d32f2f">Błąd ładowania Three.js. Sprawdź połączenie.</div>';
    return;
  }

  // ===========================================================
  // 1. SCENA / KAMERA / RENDERER
  // ===========================================================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0a0a12, 40, 120);

  const camera = new THREE.PerspectiveCamera(
    38, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  camera.position.set(15, 11, 16);

  const renderer = new THREE.WebGLRenderer({
    antialias: true, alpha: true, powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.92;
  container.appendChild(renderer.domElement);

  // Pomocnicza: tekstura z canvas
  function canvasTexture(w, h, draw, linear) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    if (!linear) t.encoding = THREE.sRGBEncoding;
    return t;
  }

  // ===========================================================
  // 1b. ENVIRONMENT MAP — studyjne softboxy (odbicia PBR)
  // Bez tego czarny plastik i szkło są płaskie. Generujemy
  // equirektangularną mapę z gradientem + jasnymi panelami światła.
  // ===========================================================
  const envEquirect = canvasTexture(1024, 512, (ctx, W, H) => {
    // pionowy gradient: ciemny dół -> ciemniejsza góra (przyciemnione studio)
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0.0, '#16161d');   // zenit
    g.addColorStop(0.42, '#0d0d12');
    g.addColorStop(0.5, '#090910');   // horyzont
    g.addColorStop(1.0, '#040406');   // podłoga
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // miękkie panele światła (softboxy) — wąskie jasne smugi na plastiku/szkle
    function softbox(cx, cy, w, h, a) {
      const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h));
      rg.addColorStop(0, 'rgba(255,255,255,' + a + ')');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(cx - w, cy - h, w * 2, h * 2);
    }
    softbox(250, 120, 120, 70, 0.85);
    softbox(730, 110, 140, 60, 0.7);
    softbox(520, 170, 90, 50, 0.4);
  }, true);
  envEquirect.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const envMap = pmrem.fromEquirectangular(envEquirect).texture;
  scene.environment = envMap;
  envEquirect.dispose();
  pmrem.dispose();

  // ===========================================================
  // 2. OŚWIETLENIE — key directional (cienie) + delikatne akcenty
  // ===========================================================
  scene.add(new THREE.AmbientLight(0x35353f, 0.25));

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.05);
  keyLight.position.set(9, 22, 11);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 80;
  keyLight.shadow.camera.left = -16;
  keyLight.shadow.camera.right = 16;
  keyLight.shadow.camera.top = 16;
  keyLight.shadow.camera.bottom = -16;
  keyLight.shadow.bias = -0.0004;
  keyLight.shadow.radius = 6;
  scene.add(keyLight);

  // Rim/wypełnienie (zimne) — modeluje krawędzie
  const rimLight = new THREE.DirectionalLight(0xcfe0ff, 0.35);
  rimLight.position.set(-10, 9, -12);
  scene.add(rimLight);

  // Subtelny akcent Posnet (czerwień) — żywsza scena, nie dominuje
  const accentRed = new THREE.PointLight(0xff4040, 0.45, 30, 2);
  accentRed.position.set(-11, 4, 9);
  scene.add(accentRed);

  // Reflektywna „studyjna" podłoga: odbija env + przyjmuje cień
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(80, 96),
    new THREE.MeshStandardMaterial({
      color: 0x060608, roughness: 0.5, metalness: 0.3, envMapIntensity: 0.22
    })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -1.15;
  floor.receiveShadow = true;
  scene.add(floor);

  // ===========================================================
  // 3. ORBITCONTROLS
  // ===========================================================
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 8;
  controls.maxDistance = 46;
  controls.maxPolarAngle = Math.PI / 2 - 0.03;
  controls.target.set(0, 0.3, 0);
  controls.autoRotateSpeed = 0.7;
  controls.addEventListener('start', () => { controls.autoRotate = false; });

  // ===========================================================
  // 4. POMOCNICZE — geometrie
  // ===========================================================
  function roundedRectShape(w, h, r) {
    const s = new THREE.Shape();
    const x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y);
    s.lineTo(x + w - r, y);
    s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r);
    s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h);
    s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r);
    s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function roundedBoxGeom(w, h, d, r, bevel) {
    bevel = bevel == null ? 0.06 : bevel;
    const shape = roundedRectShape(w, h, r);
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: d - bevel * 2, bevelEnabled: true,
      bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 10
    });
    geo.translate(0, 0, -(d - bevel * 2) / 2);
    geo.computeVertexNormals();
    return geo;
  }

  // ===========================================================
  // 5. TEKSTURY (bump mikro-plastiku, emboss pokrywy, ekrany)
  // ===========================================================
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Mikro-tekstura plastiku (delikatne ziarno) jako bumpMap
  const microBump = canvasTexture(256, 256, (ctx, W, H) => {
    ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H);
    const img = ctx.getImageData(0, 0, W, H);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = 128 + (Math.random() - 0.5) * 26;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = n;
    }
    ctx.putImageData(img, 0, 0);
  }, true);
  microBump.wrapS = microBump.wrapT = THREE.RepeatWrapping;
  microBump.repeat.set(6, 6);

  // Stylizowany napis "EVO" (E jako trzy belki)
  function drawEvoWordmark(ctx, x, y, scale, color) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.fillStyle = color;
    const bw = 46, bh = 12, gap = 16;
    for (let i = 0; i < 3; i++) {
      const w = i === 1 ? bw * 0.78 : bw;
      ctx.fillRect(-110, -32 + i * gap, w, bh);
    }
    ctx.beginPath();
    ctx.moveTo(-46, -32); ctx.lineTo(-22, 18); ctx.lineTo(2, -32);
    ctx.lineTo(-12, -32); ctx.lineTo(-22, -6); ctx.lineTo(-32, -32);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 13; ctx.strokeStyle = color;
    ctx.beginPath(); ctx.arc(44, -7, 22, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawTileIcon(ctx, kind, cx, cy, color) {
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.save(); ctx.translate(cx, cy);
    if (kind === 'cart') {
      ctx.beginPath();
      ctx.moveTo(-20, -16); ctx.lineTo(-12, -16); ctx.lineTo(-6, 10);
      ctx.lineTo(18, 10); ctx.lineTo(22, -6); ctx.lineTo(-9, -6); ctx.stroke();
      ctx.beginPath(); ctx.arc(-2, 18, 3, 0, 7); ctx.arc(14, 18, 3, 0, 7); ctx.fill();
    } else if (kind === 'report') {
      ctx.strokeRect(-16, -18, 32, 36);
      ctx.beginPath();
      ctx.moveTo(-9, -6); ctx.lineTo(9, -6); ctx.moveTo(-9, 2); ctx.lineTo(9, 2);
      ctx.moveTo(-9, 10); ctx.lineTo(4, 10); ctx.stroke();
    } else if (kind === 'db') {
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.ellipse(0, -12 + i * 12, 18, 6, 0, 0, 7); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(-18, -12); ctx.lineTo(-18, 12);
      ctx.moveTo(18, -12); ctx.lineTo(18, 12); ctx.stroke();
    } else if (kind === 'sliders') {
      for (let i = 0; i < 3; i++) {
        const y = -14 + i * 14;
        ctx.beginPath(); ctx.moveTo(-20, y); ctx.lineTo(20, y); ctx.stroke();
        ctx.fillStyle = color; ctx.beginPath();
        ctx.arc(-20 + (i + 1) * 11, y, 5, 0, 7); ctx.fill();
      }
    } else if (kind === 'gear') {
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.stroke();
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 12, Math.sin(a) * 12);
        ctx.lineTo(Math.cos(a) * 18, Math.sin(a) * 18); ctx.stroke();
      }
    } else if (kind === 'printer') {
      ctx.strokeRect(-18, -6, 36, 18);
      ctx.strokeRect(-12, -18, 24, 12);
      ctx.fillStyle = '#fff'; ctx.fillRect(-12, 8, 24, 14);
      ctx.strokeRect(-12, 8, 24, 14);
    }
    ctx.restore();
  }

  // --- Ekran główny (UI operatora) ---
  function drawMainScreen(ctx, W, H, active) {
    ctx.fillStyle = '#eef1f5'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = active ? '#2333d6' : '#2030c8';
    ctx.fillRect(0, 0, W, 70);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(24, 26 + i * 10); ctx.lineTo(58, 26 + i * 10); ctx.stroke();
    }
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '15px sans-serif'; ctx.fillText('14.02.2023', W / 2, 30);
    ctx.font = 'bold 16px sans-serif'; ctx.fillText('13:11', W / 2, 52);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.strokeRect(W - 92, 22, 24, 26);
    ctx.fillStyle = '#fff'; ctx.fillRect(W - 49, 29, 22, 12);
    ctx.strokeRect(W - 52, 26, 30, 18);

    const tiles = [
      ['Sprzedaż', 'cart'], ['Raporty', 'report'],
      ['Bazy', 'db'], ['Parametry', 'sliders'],
      ['Ustawienia', 'gear'], ['Drukarka', 'printer']
    ];
    const gx = 26, gy = 96, gw = (W - gx * 2 - 20) / 2, gh = 134, gap = 18;
    tiles.forEach((t, i) => {
      const col = i % 2, row = (i / 2) | 0;
      const x = gx + col * (gw + 20), y = gy + row * (gh + gap);
      ctx.fillStyle = '#ffffff'; roundRect(ctx, x, y, gw, gh, 12); ctx.fill();
      ctx.fillStyle = 'rgba(32,48,200,0.06)'; roundRect(ctx, x, y, gw, gh, 12); ctx.fill();
      drawTileIcon(ctx, t[1], x + gw / 2, y + 52, active ? '#2333d6' : '#2030c8');
      ctx.fillStyle = '#3a3d48'; ctx.textAlign = 'center'; ctx.font = '17px sans-serif';
      ctx.fillText(t[0], x + gw / 2, y + gh - 22);
    });

    const by = H - 78;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#c7cad3'; ctx.lineWidth = 2;
    roundRect(ctx, 26, by, 120, 54, 10); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#3a3d48'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(86, by + 27, 12, -Math.PI * 0.65, Math.PI * 1.65); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(86, by + 11); ctx.lineTo(86, by + 26); ctx.stroke();
    ctx.fillStyle = '#2030c8'; roundRect(ctx, 166, by, W - 166 - 26, 54, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('Wyloguj', (166 + W - 26) / 2 + 8, by + 34);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    const ex = 200;
    ctx.strokeRect(ex, by + 16, 16, 22);
    ctx.beginPath(); ctx.moveTo(ex + 8, by + 27); ctx.lineTo(ex + 26, by + 27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex + 20, by + 21); ctx.lineTo(ex + 26, by + 27);
    ctx.lineTo(ex + 20, by + 33); ctx.stroke();

    if (active) {
      const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, H * 0.7);
      g.addColorStop(0, 'rgba(70,110,255,0.10)');
      g.addColorStop(1, 'rgba(70,110,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
  // Ekran startowy (splash) — duże logo EVO, czytelne z dystansu
  function drawSplash(ctx, W, H) {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#2236e2'); g.addColorStop(1, '#0a1a92');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // pasek statusu
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(0, 0, W, 60);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('POSNET', 24, 40);
    ctx.textAlign = 'right'; ctx.font = '20px sans-serif';
    ctx.fillText('14.02.2023  13:11', W - 24, 38);
    // duże logo EVO na środku
    drawEvoWordmark(ctx, W / 2 - 36, H / 2 + 10, 2.0, '#ffffff');
    // wersja + pasek postępu
    ctx.fillStyle = '#cfd8ff'; ctx.textAlign = 'center'; ctx.font = 'bold 30px sans-serif';
    ctx.fillText('EVO 1.01', W / 2, H - 150);
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; roundRect(ctx, W / 2 - 130, H - 90, 260, 12, 6); ctx.fill();
    ctx.fillStyle = '#ffffff'; roundRect(ctx, W / 2 - 130, H - 90, 180, 12, 6); ctx.fill();
  }
  const mainScreenTex = canvasTexture(520, 640, (ctx, W, H) => drawSplash(ctx, W, H));

  // --- Ekran klienta (niebieski LCD z logo EVO) ---
  const clientScreenTex = canvasTexture(440, 250, (ctx, W, H) => {

  const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const activeTweens = [];
  function tweenNumber(setter, from, to, dur) {
    return new Promise(res => activeTweens.push({
      dur, el: 0, res, apply: t => setter(from + (to - from) * t)
    }));
  }
  function tweenVec(vec, tgt, dur) {
    const s = vec.clone();
    return new Promise(res => activeTweens.push({
      dur, el: 0, res, apply: t => {
        vec.x = s.x + (tgt.x - s.x) * t;
        vec.y = s.y + (tgt.y - s.y) * t;
        vec.z = s.z + (tgt.z - s.z) * t;
      }
    }));
  }
  function updateTweens(dt) {
    for (let i = activeTweens.length - 1; i >= 0; i--) {
      const tw = activeTweens[i];
      tw.el += dt;
      const p = Math.min(tw.el / tw.dur, 1);
      tw.apply(easeInOutCubic(p));
      if (p >= 1) { activeTweens.splice(i, 1); tw.res(); }
    }
  }
  function clearTweens() { activeTweens.forEach(t => t.res()); activeTweens.length = 0; }

        ms.forEach(m => { m.transparent = v < 0.999; m.opacity = v; m.depthWrite = v > 0.5; });

    });
    group.userData.op = v;
  }
  function tweenOpacity(group, to, dur) {
    const from = group.userData.op != null ? group.userData.op : 1;
    return tweenNumber(v => setGroupOpacity(group, v), from, to, dur);

    {
      title: 'Płatności zbliżeniowe (NFC)',
      desc: 'Pole zbliżeniowe NFC umieszczone na pokrywie drukarki (symbol contactless). Obsługuje karty zbliżeniowe oraz portfele mobilne — Apple Pay, Google Pay i BLIK. Kod PIN klient potwierdza na ekranie dotykowym.',
      meta: [['Standard', 'EMVCo · NFC'], ['Płatności', 'karty · Apple/Google Pay']],
      cam: { pos: [-5.5, 9, 5.5], tgt: [0.2, 0.9, -3.4] },
      autoRotate: false,
      st: { housing: 0.55, printer: 1, lid: 0, screenMain: 0.4, screenLight: 0, mainActive: false, nfc: 1, card: true }
    },
    {
      title: 'Drukarka fiskalna',
      desc: 'Termiczna drukarka paragonów z rolką papieru pod podnoszoną pokrywą oraz ząbkowaną krawędzią odrywania. Wymiana papieru jest błyskawiczna — wystarczy unieść pokrywę i włożyć nową rolkę („clamshell").',
      meta: [['Druk', 'Termiczny'], ['Papier', 'rolka, łatwa wymiana']],
      cam: { pos: [7, 10.5, 5.5], tgt: [0, 1.4, -2.6] },
      autoRotate: false,
      st: { housing: 0.55, printer: 1, lid: 1.35, screenMain: 0.4, screenLight: 0, mainActive: false, nfc: 0, card: false }
    }
  ];

  let cardActive = false;
  function applyState(st, dur) {
    tweenOpacity(housingGroup, st.housing, dur);
    tweenOpacity(printerGroup, st.printer, dur);
    tweenOpacity(screenGroup, Math.max(st.screenMain, st.housing), dur);
    tweenNumber(v => lidPivot.rotation.x = v, lidPivot.rotation.x, st.lid, dur);
    tweenNumber(v => mainScreenMat.emissiveIntensity = v, mainScreenMat.emissiveIntensity, st.screenMain, dur);
    tweenNumber(v => screenLight.intensity = v, screenLight.intensity, st.screenLight, dur);
    tweenNumber(v => {
      nfcZone.material.opacity = v * 0.5;
      nfcZone.material.emissiveIntensity = v * 0.8;
    }, (nfcZone.material.opacity / 0.5) || 0, st.nfc, dur);
    const sctx = mainScreenTex.image.getContext('2d');
    if (st.splash) drawSplash(sctx, 520, 640);
    else drawMainScreen(sctx, 520, 640, st.mainActive);
    mainScreenTex.needsUpdate = true;
    cardActive = st.card;
  }

  // ===========================================================
  // 10. STEROWNIK SEKWENCJI + UI
  // ===========================================================
  let currentStep = 0, isPlaying = true, autoTimer = 0, transition = false;
  const AUTO = 8.0, TRANS = 1.7;
  const el = id => document.getElementById(id);
  const elBtnPlay = el('btn-play'), elDots = el('step-dots');

  steps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', () => goToStep(i));
    elDots.appendChild(d);
  });

  function updateUI(step) {
    el('step-counter').textContent = `KROK ${currentStep + 1} / ${steps.length}`;
    el('step-indicator').textContent = `${currentStep + 1} / ${steps.length}`;
    el('info-title').textContent = step.title;
    el('info-desc').textContent = step.desc;
    el('info-meta').innerHTML = step.meta.map(m =>
      `<div><div class="label">${m[0]}</div><div class="value">${m[1]}</div></div>`).join('');
    [...elDots.children].forEach((d, i) => d.classList.toggle('active', i === currentStep));
  }

  function goToStep(idx, immediate) {
    if (transition) clearTweens();
    transition = true;
    currentStep = ((idx % steps.length) + steps.length) % steps.length;
    autoTimer = 0;
    const step = steps[currentStep];
    updateUI(step);
    controls.autoRotate = false;
    const dur = immediate ? 0.1 : TRANS;
    tweenVec(camera.position, new THREE.Vector3(...step.cam.pos), dur);
    tweenVec(controls.target, new THREE.Vector3(...step.cam.tgt), dur);
    applyState(step.st, dur);
    setTimeout(() => {
      transition = false;
      if (isPlaying && step.autoRotate) controls.autoRotate = true;
    }, dur * 1000 + 50);
  }
  const nextStep = () => goToStep(currentStep + 1);
  const prevStep = () => goToStep(currentStep - 1);
  function togglePlay() {
    isPlaying = !isPlaying;
    elBtnPlay.textContent = isPlaying ? '⏸ Pauza' : '▶ Odtwórz';
    controls.autoRotate = isPlaying && steps[currentStep].autoRotate && !transition;
  }
  el('btn-next').addEventListener('click', nextStep);
  el('btn-prev').addEventListener('click', prevStep);
  elBtnPlay.addEventListener('click', togglePlay);
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') nextStep();
    else if (e.key === 'ArrowLeft') prevStep();
    else if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'Escape') goToStep(0);
  });

  // ===========================================================
  // 11. PĘTLA RENDEROWANIA
  // ===========================================================
  const clock = new THREE.Clock();
  let T = 0;
  function animate() {
    requestAnimationFrame(animate);
    frame(Math.min(clock.getDelta(), 0.1));
  }
  function frame(dt) {
    T += dt;
    updateTweens(dt);

    if (cardActive) {
      cardGroup.visible = true;
      const dip = (Math.sin(T * 1.4) * 0.5 + 0.5);
      cardGroup.position.y = 1.55 + dip * 0.85;
      cardGroup.position.z = -4.2;
      cardGroup.rotation.z = Math.sin(T * 0.8) * 0.12;
      nfcWaves.forEach((w, i) => {
        const ph = T * 2.2 - i * 0.5;
        w.material.opacity = ((Math.sin(ph) + 1) * 0.5) * 0.9;
      });
    } else {
      cardGroup.visible = false;
      nfcWaves.forEach(w => w.material.opacity = 0);
    }

    accentRed.intensity = 0.45 + Math.sin(T * 1.2) * 0.1;

    if (isPlaying && !transition) {
      autoTimer += dt;
      if (autoTimer >= AUTO) nextStep();
    }
    controls.update();
    renderer.render(scene, camera);
  }

  // ===========================================================
  // 12. RESIZE + START
  // ===========================================================
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  goToStep(0, true);
  animate();
  setTimeout(() => el('loader').classList.add('hidden'), 400);

})();
</script>
</body>
</html>
